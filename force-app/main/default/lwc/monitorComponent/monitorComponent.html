<template>
    <!-- <h1 class="p">WAZZAAAAPPP</h1> -->
    <lightning-card title="Accounts & Opportunities Monitor" icon-name="standard:account">
        <div class="slds-var-p-around_medium">
            <template if:true={accountsData}>
                <lightning-accordion allow-multiple-sections-open>
                    <template for:each={accountsData} for:item="acc">
                        <lightning-accordion-section 
                            key={acc.accountId} 
                            name={acc.accountId} 
                            label={acc.sectionLabel}>

                            <!-- If Opportunities Exist -->
                            <template if:true={acc.hasOpportunities}>
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col">Opportunity Name</th>
                                            <th scope="col">Stage</th>
                                            <th scope="col">Amount</th>
                                            <th scope="col" class="slds-text-align_right">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={acc.opportunities} for:item="opp">
                                            <tr key={opp.Id}>
                                                <td>{opp.Name}</td>
                                                <td>{opp.StageName}</td>
                                                <td>
                                                    <lightning-formatted-number 
                                                        value={opp.Amount} 
                                                        format-style="currency" 
                                                        currency-code="USD">
                                                    </lightning-formatted-number>
                                                </td>
                                                <td class="slds-text-align_right">
                                                    <template if:false={opp.isClosed}>
                                                        <lightning-button 
                                                            variant="neutral" 
                                                            label="Mark as Closed" 
                                                            data-id={opp.Id} 
                                                            data-name={opp.Name}
                                                            onclick={handleOpenModal}>
                                                        </lightning-button>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>

                            <!-- If No Opportunities Exist -->
                            <template if:false={acc.hasOpportunities}>
                                <p class="slds-var-p-vertical_small slds-text-color_weak">
                                    No opportunities found for this account.
                                </p>
                            </template>

                        </lightning-accordion-section>
                    </template>
                </lightning-accordion>
            </template>
            <template if:true={error}>
                <p class="slds-text-color_error">Error loading accounts data.</p>
            </template>
        </div>
    </lightning-card>

    <!-- Modal for Closing Opportunity -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Update Opportunity: {selectedOppName}</h2>
                </header>
                <div class="slds-modal__content slds-var-p-around_medium">
                    <lightning-combobox
                        name="stageSelect"
                        label="Select New Stage"
                        value={selectedStage}
                        placeholder="Choose Stage"
                        options={stageOptions}
                        onchange={handleStageChange}
                        required>
                    </lightning-combobox>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCloseModal}></lightning-button>
                    <lightning-button variant="brand" label="Update" class="slds-var-m-left_x-small" onclick={handleUpdateOpportunity} disabled={isUpdateDisabled}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
